name: Publish scheduled posts

on:
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate only, no publishing)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run publish script
        env:
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-posts.mjs --dry-run
          else
            node scripts/publish-posts.mjs
          fi

      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add medium/ dev-to/ .publish-state.json
          git diff --cached --quiet || git commit -m "chore: update published post status and state"
          git push origin main
