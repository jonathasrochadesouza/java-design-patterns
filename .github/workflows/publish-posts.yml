name: Publish dev.to posts

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate only, no publishing)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run publish script (dev.to only)
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-posts.mjs --dry-run --devto-only
          else
            node scripts/publish-posts.mjs --devto-only
          fi

      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-to/ .publish-state.json
          git diff --cached --quiet || git commit -m "chore: update dev.to published post status"
          git push origin main

      - name: Disable workflow if all posts published
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(ls dev-to/*.md | wc -l)
          PUBLISHED=$(grep -l 'status: "published"' dev-to/*.md | wc -l)
          echo "Published: $PUBLISHED / $TOTAL"
          if [ "$PUBLISHED" -eq "$TOTAL" ]; then
            echo "All posts published. Disabling workflow..."
            gh workflow disable "Publish dev.to posts"
          else
            echo "$((TOTAL - PUBLISHED)) post(s) remaining. Workflow stays active."
          fi
